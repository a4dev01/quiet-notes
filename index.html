<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ef"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Quiet Notes</title></head><body>
<div id="lock" hidden><div><b>✦</b><h1>Quiet Notes</h1><p id="lockText">Unlock your private notebook.</p><form id="unlock"><input id="password" type="password" placeholder="Master password" required><button>Unlock</button></form></div></div>
<main id="app" hidden><aside id="side"><header><strong>✦ Quiet Notes</strong><button data-a="settings">⚙</button></header><button class="primary" data-a="new">＋ New note <kbd>N</kbd></button><nav><button data-v="all">All Notes <b id="allC"></b></button><button data-v="pinned">⌖ Pinned <b id="pinC"></b></button><button data-v="archive">▱ Archive <b id="arcC"></b></button><button data-v="trash">⌫ Trash <b id="trashC"></b></button></nav><p>Tags</p><div id="tagsList"></div><footer><button data-a="lock">⌑ Lock now</button><small>Private to this browser</small></footer></aside>
<section id="list"><header><button class="mob" data-a="menu">☰</button><div><small id="eyebrow">YOUR NOTEBOOK</small><h1 id="viewTitle">All Notes</h1></div><button data-a="command">⌘</button></header><label class="search">⌕ <input id="search" placeholder="Search notes" aria-label="Search notes"><kbd>/</kbd></label><div id="notes"></div><div id="empty" hidden><h2>No notes yet</h2><p>Write down the thought before it slips away.</p><button class="primary" data-a="new">Create a note</button></div></section>
<section id="edit"><header><button class="mob" data-a="back">‹</button><span id="status">Saved</span><button data-a="pin">⌖</button><button data-a="archive">▱</button><button data-a="duplicate">⧉</button><button data-a="trash">⌫</button><button data-a="focus">⛶</button></header><div id="noNote"><h2>Make room for your thoughts.</h2><button class="primary" data-a="new">Create a note</button></div><article id="editor" hidden><input id="title" placeholder="Untitled" maxlength="160"><textarea id="body" placeholder="Start writing…"></textarea><footer><input id="tags" placeholder="# Add tags (comma separated)"><span id="stats"></span></footer></article></section></main>
<dialog id="modal"><form method="dialog"><header><h2 id="modalTitle"></h2><button>×</button></header><div id="modalBody"></div><footer id="modalFoot"></footer></form></dialog><dialog id="commands"><input id="commandSearch" placeholder="Type a command…"><div id="commandList"></div></dialog><div id="toast" hidden></div><script src="app.js"></script></body></html>
